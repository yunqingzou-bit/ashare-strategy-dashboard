name: daily-update
on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: restore event cache
        uses: actions/cache/restore@v4
        with:
          path: data/events
          key: events-${{ github.run_id }}
          restore-keys: |
            events-
      - run: pip install -r requirements.txt
      - name: run pipeline
        run: python scripts/update.py --days 45
      - name: save event cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/events
          key: events-${{ github.run_id }}
      - name: daily backup snapshot
        run: |
          DATE=$(date -u +%F)
          mkdir -p backups
          cp data/result.json "backups/result-${DATE}.json"
          cp data/final.json "backups/final-${DATE}.json"
          ls -l backups | tail -6
          find backups -type f -mtime +180 -delete || true
      - name: commit and push
        run: |
          DATE=$(date -u +%F)
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs backups
          git commit -m "daily update ${DATE}" || echo 'nothing to commit'
          git fetch origin main
          git merge -X ours --no-edit origin/main || echo 'merge skipped'
          git push
          git tag -f "data-${DATE}" >/dev/null 2>&1 || true
          git push -f origin "data-${DATE}" >/dev/null 2>&1 || true
          echo 'pushed with backup tag data-'${DATE}
